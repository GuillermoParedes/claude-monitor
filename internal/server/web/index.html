<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d97757' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%236ec88c'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #181a20; --card: #181a20; --line: #2c2f38; --hover: #24272f;
    --text: #e8eaee; --dim: #8c94a2; --label: #68707e; --track: #30343e;
    --accent: #d97757; --accent-dim: rgba(217,119,87,.45);
    --green: #6ec88c; --amber: #ebbe5a; --red: #e46e64; --blue: #78aaeb; --off: #828a96;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f7; --card: #ffffff; --line: #e3e5ea; --hover: #f0f1f4;
      --text: #1d2026; --dim: #5c6370; --label: #8a919c; --track: #e6e8ec;
      --accent-dim: rgba(217,119,87,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.35 "Segoe UI", system-ui, -apple-system, "SF Pro Text", Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .card { max-width: 380px; margin: 24px auto; padding: 16px; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; }
  body.panel { background: var(--card); overflow: hidden; }
  body.panel .card { margin: 0; max-width: none; border: 0; border-radius: 0; min-height: 100vh; }

  header { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  h1 { font-size: 15px; letter-spacing: .06em; margin: 0; font-weight: 700; }
  .status { margin-left: auto; font-size: 12px; color: var(--dim); }
  .sub { color: var(--label); font-size: 12px; margin-top: 2px; }

  section { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
  h2 { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--label);
       margin: 0 0 8px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 20px; }
  .row .k { color: var(--dim); width: 52px; flex: none; font-size: 12px; }
  .row .v { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); flex: 1; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--green); min-width: 3px; }
  .muted { color: var(--label); font-size: 12px; }

  .sess { margin: 0 -8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .sess:hover { background: var(--hover); }
  .sess .top { display: flex; align-items: baseline; gap: 6px; }
  .sess .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .model { color: var(--label); font-size: 10.5px; }
  .sess .st { margin-left: auto; font-size: 12px; white-space: nowrap; }
  .sess .bot { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  .sess .bot .bar { flex: 0 0 55%; }
  .sess .bot .v { margin-left: auto; color: var(--label); font-size: 11.5px; }

  .kv { display: flex; font-size: 13px; margin: 2px 0; }
  .kv .k { color: var(--dim); } .kv .v { margin-left: auto; font-variant-numeric: tabular-nums; }
  .chart-h { display: flex; justify-content: space-between; color: var(--label); font-size: 10.5px; margin-top: 10px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 36px; border-bottom: 1px solid var(--line); margin-top: 6px; }
  .bars.days { gap: 8px; }
  .bars i { flex: 1; background: var(--accent-dim); border-radius: 2px 2px 0 0; min-height: 0; }
  .bars i.now { background: var(--accent); }
  .axis { display: flex; justify-content: space-between; color: var(--label); font-size: 10px; margin-top: 3px; }
  .axis.days span { flex: 1; text-align: center; }
  .axis.days span.now { color: var(--text); font-weight: 600; }
  .list { font-size: 12px; margin-top: 8px; }
  .list .kv { font-size: 12px; } .list .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }

  footer { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; display: flex; gap: 14px;
           font-size: 12px; align-items: center; }
  footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  footer a:hover { text-decoration: underline; }
  footer .upd { margin-left: auto; color: var(--label); }
  .stale .upd { color: var(--red); }

  .menu { position: fixed; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 10; min-width: 190px; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
                 font: inherit; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
  .menu button:hover { background: var(--hover); }
  .menu button.primary { font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 6px 12px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card" id="card">
  <header>
    <span class="dot" id="dot"></span>
    <h1>CLAUDE</h1>
    <span class="status" id="status">…</span>
  </header>
  <div class="sub" id="sub"></div>

  <section>
    <h2 data-i18n="plan">Plan</h2>
    <div id="plan"></div>
  </section>

  <section>
    <h2 id="sessTitle" data-i18n="sessions">Sessions</h2>
    <div id="sessions"></div>
  </section>

  <section>
    <h2 data-i18n="usage">Usage (API equivalent)</h2>
    <div class="kv"><span class="k" data-i18n="today">Today</span><span class="v" id="today"></span></div>
    <div class="kv"><span class="k" data-i18n="week">7 days</span><span class="v" id="week"></span></div>
    <div class="chart-h"><span data-i18n="byHour">Today by hour</span><span id="peak"></span></div>
    <div class="bars" id="hours"></div>
    <div class="axis"><span>0h</span><span>12h</span><span>23h</span></div>
    <div class="chart-h"><span data-i18n="last7">Last 7 days ($)</span><span></span></div>
    <div class="bars days" id="days"></div>
    <div class="axis days" id="dayAxis"></div>
    <div class="list">
      <div class="kv"><span class="k" data-i18n="projects">Projects</span><span class="v" id="projects"></span></div>
      <div class="kv"><span class="k" data-i18n="models">Models</span><span class="v" id="models"></span></div>
    </div>
  </section>

  <section id="perfSec" hidden>
    <h2 id="perfTitle">System</h2>
    <div class="row"><span class="k">CPU</span><div class="bar"><i id="cpuBar"></i></div><span class="v" id="cpu"></span></div>
    <div class="row"><span class="k">RAM</span><div class="bar"><i id="ramBar"></i></div><span class="v" id="ram"></span></div>
  </section>

  <footer id="footer">
    <a id="openBrowser" data-i18n="openFull">Open in browser</a>
    <span class="upd" id="updated"></span>
  </footer>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const PANEL = new URLSearchParams(location.search).get("panel") === "1";
if (PANEL) document.body.classList.add("panel");

const I18N = {
  en: {
    plan: "Plan", sessions: "Sessions", usage: "Usage (API equivalent)", today: "Today", week: "7 days",
    byHour: "Today by hour", last7: "Last 7 days ($)", projects: "Projects", models: "Models",
    openFull: "Open in browser", working: "working", waiting: "needs permission", idle: "idle", off: "no sessions",
    stale: "no data for {0}", sub: "{0} session(s) · {1} active now", noPlan: "no data yet: fills in as you use Claude Code",
    h5: "5 h", wk: "week", noSessions: "no open sessions", more: "+{0} more", peak: "peak ${0}/h",
    updated: "updated {0}", goTo: "Go to session", folder: "Open folder", terminal: "Open new terminal here",
    thinking: "thinking", running: "running", compacting: "compacting", permission: "PERMISSION",
    days: "SMTWTFS", focused: "Focused {0}", raised: "Brought {0} to front", failed: "Could not reach the session",
    tip: "Click: go to session · right-click: more", system: "System",
  },
  es: {
    plan: "Plan", sessions: "Sesiones", usage: "Consumo (equiv. API)", today: "Hoy", week: "7 días",
    byHour: "Hoy por hora", last7: "Últimos 7 días ($)", projects: "Proyectos", models: "Modelos",
    openFull: "Abrir en el navegador", working: "trabajando", waiting: "espera permiso", idle: "en reposo", off: "sin sesiones",
    stale: "sin datos hace {0}", sub: "{0} sesiones · {1} activas ahora", noPlan: "sin datos: se llenan al usar Claude Code",
    h5: "5 h", wk: "semana", noSessions: "ninguna sesión abierta", more: "+{0} más", peak: "pico ${0}/h",
    updated: "actualizado {0}", goTo: "Ir a la sesión", folder: "Abrir carpeta", terminal: "Abrir terminal nueva aquí",
    thinking: "pensando", running: "ejecutando", compacting: "compactando", permission: "PERMISO",
    days: "DLMXJVS", focused: "Panel {0} enfocado", raised: "{0} al frente", failed: "No se pudo llegar a la sesión",
    tip: "Clic: ir a la sesión · clic derecho: más", system: "Sistema",
  },
};
const LANG = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
const T = (k, ...a) => (I18N[LANG][k] ?? I18N.en[k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i]);
document.documentElement.lang = LANG;
document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));

const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const money = n => (Math.round(n * 100) / 100).toFixed(2);
const tok = n => n >= 1e9 ? (n/1e9).toFixed(2)+"G" : n >= 1e7 ? (n/1e6).toFixed(1)+"M" : n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
const level = (p, warn, crit, base) => p >= crit ? css("--red") : p >= warn ? css("--amber") : base;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = s => s < 120 ? s + "s" : s < 7200 ? Math.floor(s/60) + "m" : Math.floor(s/3600) + "h";

let state = null;

async function post(path) {
  const r = await fetch(path, { method: "POST", headers: { "X-Claude-Monitor": "1" } });
  let body = {};
  try { body = await r.json(); } catch {}
  return { ok: r.ok, body };
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600);
}

async function goTo(s) {
  const { ok, body } = await post("/api/focus/" + encodeURIComponent(s.id));
  if (!ok) return toast(T("failed"));
  if (PANEL) window.close();
  else toast(body.herdr ? T("focused", body.herdr) : body.raised ? T("raised", body.raised) : s.name);
}

function showMenu(e, s) {
  e.preventDefault();
  const m = $("menu");
  m.innerHTML = "";
  [["goTo", () => goTo(s), true], ["folder", () => post("/api/folder/" + s.id)], ["terminal", () => { post("/api/terminal/" + s.id); if (PANEL) window.close(); }]]
    .forEach(([k, fn, primary]) => {
      const b = document.createElement("button");
      b.textContent = T(k); if (primary) b.className = "primary";
      b.onclick = () => { m.hidden = true; fn(); };
      m.appendChild(b);
    });
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 6) + "px";
  m.style.top = Math.min(e.clientY, innerHeight - r.height - 6) + "px";
}
document.addEventListener("click", e => { if (!$("menu").contains(e.target)) $("menu").hidden = true; });

function bars(el, values, highlight) {
  const max = Math.max(...values, 0);
  el.innerHTML = values.map((v, i) => {
    const h = max > 0 && v > 0 ? Math.max(2, 36 * v / max) : 0;
    return `<i class="${i === highlight ? "now" : ""}" style="height:${h}px" title="$${money(v)}"></i>`;
  }).join("");
  return max;
}

function render(s) {
  state = s;
  const age = Math.floor(Date.now() / 1000) - s.updated;
  const stale = age > 30;
  const status = stale ? "stale" : s.status;
  const colors = { working: "--green", waiting: "--amber", idle: "--blue", off: "--off", stale: "--red" };
  $("dot").style.background = css(colors[status] || "--off");
  $("status").textContent = stale ? T("stale", ago(age)) : T(status);
  $("status").style.color = status === "waiting" ? css("--amber") : stale ? css("--red") : "";
  $("sub").textContent = T("sub", s.active, s.working);

  // Plan
  const L = s.limits;
  const planRow = (k, w) => w ? `<div class="row"><span class="k">${T(k)}</span><div class="bar"><i style="width:${Math.min(100, w.pct)}%;background:${level(w.pct, 70, 90, css("--green"))}"></i></div><span class="v">${w.pct}%${w.resetIn ? " · " + esc(w.resetIn) : ""}</span></div>` : "";
  $("plan").innerHTML = L && (L.fiveHour || L.sevenDay) ? planRow("h5", L.fiveHour) + planRow("wk", L.sevenDay) : `<div class="muted">${T("noPlan")}</div>`;

  // Sessions
  const more = s.sessions ? Math.max(0, s.sessions.length - 8) : 0;
  $("sessTitle").textContent = T("sessions") + (more ? "  (" + T("more", more) + ")" : "");
  const sess = (s.sessions || []).slice(0, 8);
  $("sessions").innerHTML = sess.length ? "" : `<div class="muted">${T("noSessions")}</div>`;
  sess.forEach(x => {
    const label = x.flag === "waiting" ? T("permission") : x.tool || T(x.state || "idle");
    const sc = x.flag === "waiting" ? css("--amber") : x.flag === "working" ? css("--green") : css("--dim");
    const d = document.createElement("div");
    d.className = "sess"; d.title = x.cwd + "\n" + T("tip");
    d.innerHTML = `<div class="top"><span class="name">${esc(x.name)}</span><span class="model">${esc(x.model)}</span><span class="st" style="color:${sc}">${esc(label)}</span></div>
      <div class="bot"><div class="bar"><i style="width:${x.ctx}%;background:${level(x.ctx, 75, 90, css("--accent"))}"></i></div><span class="v">ctx ${x.ctx}% · $${money(x.cost)}</span></div>`;
    d.onclick = () => goTo(x);
    d.oncontextmenu = e => showMenu(e, x);
    d.onauxclick = e => { if (e.button === 1) post("/api/folder/" + x.id); };
    $("sessions").appendChild(d);
  });

  // Usage
  $("today").textContent = `${tok(s.todayTokens)} tok · $${money(s.todayCost)}`;
  $("week").textContent = `${tok(s.weekTokens)} tok · $${money(s.weekCost)}`;
  const peak = bars($("hours"), s.hours || [], s.hourNow);
  $("peak").textContent = T("peak", money(peak));
  const days = s.days || [];
  bars($("days"), days.map(d => d.cost), days.length - 1);
  $("dayAxis").innerHTML = days.map((d, i) => `<span class="${i === days.length - 1 ? "now" : ""}">${T("days")[d.weekday]}${d.cost >= 1 ? " " + Math.round(d.cost) : ""}</span>`).join("");
  const list = a => (a || []).map(x => `${esc(x.name)} $${money(x.cost)}`).join("   ") || "--";
  $("projects").innerHTML = list(s.projects);
  $("models").innerHTML = list(s.models);

  // Perf
  if (s.perf && s.perf.available) {
    $("perfSec").hidden = false;
    $("perfTitle").textContent = s.perf.label || T("system");
    $("cpuBar").style.width = s.perf.cpu + "%"; $("cpu").textContent = s.perf.cpu + "%";
    $("ramBar").style.width = s.perf.ramPct + "%"; $("ram").textContent = `${s.perf.ramUsedGB} / ${s.perf.ramTotalGB} GB`;
  }

  $("updated").textContent = T("updated", new Date(s.updated * 1000).toLocaleTimeString());
  $("footer").classList.toggle("stale", stale);
}

async function poll() {
  try {
    const r = await fetch("/api/state" + (PANEL ? "?panel=1" : ""), { cache: "no-store" });
    if (r.headers.get("X-Close-Panel") === "1") return window.close();
    if (r.ok) render(await r.json());
  } catch {}
}

$("openBrowser").onclick = () => { window.open(location.origin + "/", "_blank"); if (PANEL) window.close(); };
if (PANEL) {
  $("openBrowser").hidden = false;
  // Comportamiento de panel flotante: se cierra al perder el foco o con Esc.
  let armed = false;
  setTimeout(() => armed = true, 600);
  window.addEventListener("blur", () => { if (armed && $("menu").hidden) window.close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") window.close(); });
} else {
  $("openBrowser").hidden = true;
}

poll();
setInterval(poll, PANEL ? 1000 : 2500);
</script>
</body>
</html>
