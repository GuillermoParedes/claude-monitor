FontColor=#sc1#
Text=#S1_STATE#

[MeterS1Bar]
Meter=Shape
Group=S1
X=15
Y=156
Shape=Rectangle 0,0,#BarW#,5,2 | Fill Color #cTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(1,#BarW#*#S1_CTX#/100)),5,2 | Fill Color #c1# | StrokeWidth 0
DynamicVariables=1

[MeterS1Info]
Meter=String
MeterStyle=sText | sRight | sSmall
Group=S1
Y=152
Text=ctx #S1_CTX#%  -  $#S1_COST#

; Whole-row hit area: click = go to session, middle-click = open folder.
[MeterS1Hit]
Meter=Shape
Group=S1
X=10
Y=136
Shape=Rectangle 0,0,(#W#-20),30,4 | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1
MouseOverAction=[!SetOption MeterS1Hit Shape "Rectangle 0,0,(#W#-20),30,4 | Fill Color 255,255,255,12 | StrokeWidth 0"][!UpdateMeter MeterS1Hit][!Redraw]
MouseLeaveAction=[!SetOption MeterS1Hit Shape "Rectangle 0,0,(#W#-20),30,4 | Fill Color 0,0,0,1 | StrokeWidth 0"][!UpdateMeter MeterS1Hit][!Redraw]
LeftMouseUpAction=["#ExePath#" focus #S1_ID#]
MiddleMouseUpAction=["#ExePath#" folder #S1_ID#]
ToolTipTitle=#S1_NAME#  (#S1_MODEL#)
ToolTipText=#S1_CWD##CRLF##S1_TOK# tokens today#CRLF#Click: go to session  -  middle-click: open folder

