; --- Measures ---

[mRaw]
Measure=WebParser
URL=#StateUrl#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=2
CodePage=65001
FinishAction=[!UpdateMeasure mScript]

[mScript]
Measure=Script
ScriptFile=#@#claude.lua

[mWinCpu]
Measure=CPU

[mWinRamUsed]
Measure=PhysicalMemory

[mWinRamTotal]
Measure=PhysicalMemory
Total=1

; --- Styles ---

[sText]
FontFace=Segoe UI
AntiAlias=1
DynamicVariables=1
FontColor=#cText#
FontSize=9

[sRight]
StringAlign=Right
X=(#W#-14)

[sSection]
FontSize=7.5
FontWeight=600
FontColor=#cLabel#
StringCase=Upper

[sSmall]
FontSize=8
FontColor=#cLabel#

