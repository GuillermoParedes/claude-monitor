;  Claude Monitor  -  Rainmeter skin (optional extra for Windows)
;
;  Reads http://127.0.0.1:47821/state.txt, served by `claude-monitor run`
;  (or by the WSL collector: WSL2 forwards localhost to Windows).
;  Install: copy this folder to Documents\Rainmeter\Skins\ and load
;  ClaudeMonitor.ini from the Rainmeter manager.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Open dashboard
ContextAction=["http://127.0.0.1:47821/"]

[Metadata]
Name=Claude Monitor
Author=claude-monitor
Information=Claude Code plan limits, sessions, usage history and system load.
Version=2.0

[Variables]
StateUrl=http://127.0.0.1:47821/state.txt
; Set by the script from %LOCALAPPDATA%
ExePath=claude-monitor.exe

W=270
H=644
BarW=150
ChartW=240
ChartH=30

cBg=18,20,26,240
cLine=255,255,255,22
cText=232,234,238
cDim=132,140,154
cLabel=100,108,122
cAccent=217,119,87
cAccentDim=217,119,87,110
cTrack=255,255,255,26
cGreen=110,200,140
cAmber=235,190,90
cRed=228,110,100
cBlue=120,170,235
cOff=120,128,140

; Defaults (overwritten by the script)
DotColor=120,128,140
StatusColor=132,140,154
StatusText=cargando...
MoreText=
NoSessions=
ACTIVE=0
WORKING=0
TOK_TODAY=0
COST_TODAY=0.00
TOK_WEEK=0
COST_WEEK=0.00
WSL_CPU=0
WSL_RAM=0
WSL_RAMPCT=0
WSL_IO=0
